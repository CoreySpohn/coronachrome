[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "coronachrome"
description = "Multi-wavelength analysis tools for coronagraphic direct imaging."
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
dynamic = ['readme', 'version']
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["jax>=0.8.1", "equinox>=0.13.2", "lineax>=0.1.0", "numpy>=2.0", "optixstuff>=1.6.0"]

[project.optional-dependencies]
dev = ["pre-commit>=3.6"]
# The docs pages execute and draw through coronachrome.viz, so the docs extra
# carries the viz extra.
docs = [
    "sphinx>=7.2",
    "myst-nb>=1.0",
    "sphinx-book-theme>=1.1",
    "sphinx-autoapi>=3.0",
    "ipykernel>=6.29",
    "coronachrome[viz]>=1.1.0",
]
# The viz tests import matplotlib and eyepiece, so the test extra has to carry
# the viz extra: without it those tests fail to import on a clean runner.
test = [
    "pytest>=7.3.2",
    "hypothesis>=6.79.1",
    # The budget plugin uses psutil for portable process memory readings.
    "psutil>=5.9.4",
    "pytest-cov>=1.0",
    "pytest-xdist>=2.5",
    "pytest-testmon>=2.0.7",
    "pytest-markdown-docs>=0.1.0",
    "pytest-timeout>=1.3.1",
    "pytest-fail-slow>=0.1.0",
    "hwoutils>=1.10.0",
    "coronachrome[viz]>=1.1.0",
]
# eyepiece>=0.4.0 carries PlotResult, imshow_log, imshow_diverging,
# SourceStyles and record; hwostyle>=1.4.0 carries the semantic cmaps
# (readouts) that coronachrome.viz reads directly.
viz = ["eyepiece>=0.4.0", "hwostyle>=1.4.0", "matplotlib>=3.11"]

[project.urls]
Homepage = "https://github.com/CoreySpohn/coronachrome"
Issues = "https://github.com/CoreySpohn/coronachrome/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/coronachrome/_version.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[tool.hatch.build.targets.wheel]
packages = ["src/coronachrome"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    # tol_colors builds colormaps with set_bad, pending deprecation in Matplotlib 3.11.
    'ignore:The set_bad function will be deprecated in a future version\.:PendingDeprecationWarning:tol_colors',
]
markers = [
    "medium: tests with a 30-second default time budget",
    "slow: tests with a 300-second default time budget, run nightly",
]

[tool.testbudget]
library = "coronachrome"
mode = "report"
unit_s = 5
medium_s = 30
slow_s = 300

[tool.deptry]
known_first_party = ["coronachrome"]
optional_dependencies_dev_groups = ["dev", "docs", "test"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/coronachrome"]
